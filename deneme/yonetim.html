<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}  /* gizli öğeler (ör. TV duyurusu) display kurallarına rağmen görünmesin – 6.11.2026 */
/* Layout: üstte kimlik bandı + deneme saati şeridi; altında seçilen görünüm (başlangıç, TV, öğrenci telefonu, hoca portalı, yönetim) */
:root{
  --bg:#EDF3F3; --surface:#FFFFFF; --ink:#0F2529; --muted:#55696C; --line:#CDDADB;
  --accent:#0B6E7E; --accent-ink:#FFFFFF; --accent-soft:#DAEDEF;
  --hl:#B86A00; --hl-soft:#FCEBCF;
  --ok:#1B6E43; --ok-soft:#DDF0E4; --warn:#9A5800; --warn-soft:#FBEDD5; --bad:#AE2A20; --bad-soft:#F8E0DC;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1618; --surface:#122226; --ink:#E2EDEE; --muted:#94AAAD; --line:#25393D;
  --accent:#5EC2D1; --accent-ink:#06191C; --accent-soft:#14343A;
  --hl:#F2B260; --hl-soft:#3A2A12;
  --ok:#63C28E; --ok-soft:#15301F; --warn:#E3AA4F; --warn-soft:#382A12; --bad:#EF8C82; --bad-soft:#3B1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1618; --surface:#122226; --ink:#E2EDEE; --muted:#94AAAD; --line:#25393D;
  --accent:#5EC2D1; --accent-ink:#06191C; --accent-soft:#14343A;
  --hl:#F2B260; --hl-soft:#3A2A12;
  --ok:#63C28E; --ok-soft:#15301F; --warn:#E3AA4F; --warn-soft:#382A12; --bad:#EF8C82; --bad-soft:#3B1C19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1200px;margin:0 auto}
.band{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:14px 10px}
.band .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.band nav a{font-size:13px;color:var(--accent);text-decoration:none;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.band nav a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.clockbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:18px}
.clockbar .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600}
.clockbar .d{font-size:13px;color:var(--muted)}
.clockbar .sp{flex:1 1 auto}
.clockbar select,.clockbar .btn{width:auto}
h2{font-size:18px;margin:0 0 10px;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{align-items:flex-end}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 14px;cursor:pointer;line-height:1.2}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:13px;font-weight:600}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.bad.ghost{background:transparent;color:var(--bad)}
.btn.big{font-size:16px;padding:12px 18px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
button{transition:transform .08s ease,filter .15s ease}
button:active:not([disabled]):not(.mesgul){transform:scale(.96)}
button.mesgul{position:relative;pointer-events:none;cursor:progress;filter:grayscale(.6);opacity:.7;padding-right:30px!important}
button.mesgul::after{content:"";position:absolute;right:9px;top:50%;width:13px;height:13px;margin-top:-7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:dondur .7s linear infinite}
@keyframes dondur{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){button.mesgul::after{animation-duration:2s}}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input[type=checkbox]{width:auto}
label.f{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
label.ck{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-mut{background:var(--bg);color:var(--muted);border:1px solid var(--line)} .p-hl{background:var(--hl-soft);color:var(--hl)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.note{padding:12px 14px;border-radius:9px;font-weight:700}
.n-warn{background:var(--warn-soft);color:var(--warn)} .n-bad{background:var(--bad-soft);color:var(--bad)} .n-ok{background:var(--ok-soft);color:var(--ok)} .n-acc{background:var(--accent-soft);color:var(--accent)} .n-hl{background:var(--hl-soft);color:var(--hl)}
.note p{margin:4px 0 0;font-weight:400;color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.tabs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
/* başlangıç */
.scn{display:flex;flex-direction:column;gap:8px}
.scn .exp{font-size:13px;color:var(--muted)}
.scn .no{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
/* TV */
.tv{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
@media (max-width:860px){.tv{grid-template-columns:1fr}}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#qr{background:#FFFFFF;padding:14px;border-radius:10px;line-height:0;min-height:40px}
#qr img,#qr canvas{max-width:100%;height:auto}
.code{font-family:var(--f-mono);font-size:58px;font-weight:600;letter-spacing:.12em;line-height:1}
.bar{height:6px;width:240px;max-width:100%;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.calls{list-style:none;margin:0;padding:0}
.calls li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.calls li.late{color:var(--hl)}
.calls .tm{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.calls b{font-size:17px}
/* telefon */
.phone{max-width:430px;margin:0 auto;border:1px solid var(--line);border-radius:26px;padding:22px 18px;background:var(--surface)}
.phone .big{font-size:26px;font-weight:700;line-height:1.2;text-wrap:balance}
.res{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.r-ok{background:var(--ok-soft);color:var(--ok)} .r-acc{background:var(--accent-soft);color:var(--accent)} .r-bad{background:var(--bad-soft);color:var(--bad)} .r-warn{background:var(--warn-soft);color:var(--warn)} .r-hl{background:var(--hl-soft);color:var(--hl)}
.res p{margin:0;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
/* portal */
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.menu button{font:inherit;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer}
.menu button b{color:var(--accent);font-size:17px}
.menu button span{font-size:13px;color:var(--muted)}
.login{max-width:440px;margin:0 auto}
/* jüri */
.jhead{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
.pair{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.pair.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pair.done{background:var(--bg)}
.pair .ph{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.pair .ph b{font-size:16px}
.mem{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.mem .nm{font-size:17px;font-weight:700}
.mem.ghost .nm{text-decoration:line-through;color:var(--muted)}
.crit{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.crit label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.crit input{font-family:var(--f-mono);font-size:16px;padding:7px 9px}
.crit .hlb input{border-color:var(--hl);background:var(--hl-soft)}
.crit .pv{font-size:12px;color:var(--hl);font-weight:700}
.tot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:14px}
.tot .n{font-family:var(--f-mono);font-size:18px;font-weight:600}
.reasons{font-size:13px;color:var(--bad)}
.reasons li{margin:2px 0}
/* yönetim */
.board th,.board td{font-size:12px;padding:5px 6px;white-space:nowrap}
.chip{display:block;font-size:12px;padding:3px 6px;border-radius:6px;margin:2px 0;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.run{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.cl{color:var(--muted);border-style:dashed}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.dztab{border-collapse:collapse;width:100%;font-size:14px}
.dztab th,.dztab td{border:1px solid var(--line,#d7e0e0);padding:6px 10px;text-align:center}
.dztab tr>th:first-child{text-align:left;font-weight:600;white-space:nowrap}
.dztab tr:first-child th{background:var(--bg)}
.dztab td:last-child,.dztab tr:first-child th:last-child{font-weight:700;background:var(--bg)}
.dztab tr.kritik>th:first-child{color:#b3261e}
.dzn{font:inherit;font-family:var(--f-mono);font-size:16px;font-weight:700;border:1px solid transparent;background:none;cursor:pointer;padding:2px 10px;border-radius:8px;color:inherit;text-decoration:underline dotted}
.dzn:hover,.dzn.sec{border-color:currentColor}
.dzn.kr{color:#b3261e;background:#fdecea}
.dzliste{margin-top:10px}
.stat{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface);min-width:120px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.lists{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.lists ul{margin:0;padding-left:18px;font-size:14px}
.log{max-height:360px;overflow:auto;font-size:13px}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.proj .jn{font-size:40px;font-weight:700;line-height:1.1}
.proj .cur{font-size:28px;font-weight:700}
.inline-confirm{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 8px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}.tvpage .code{font-size:96px}.tvpage .calls b{font-size:22px}.tvpage h2{font-size:28px}</style>
<style>
/* 30.10.2026: dil seçimi, sorun bildirme, anket, mesajlar */

<script>
/* Ortak.html – tüm sayfalarda kullanılan yardımcılar */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Sunucu çağrısı: Google adresinden açılınca google.script.run; dış sayfadan (GitHub Pages) açılınca çerezsiz fetch.
   Çerezsiz istek, tarayıcıda birden fazla Google hesabı açık olduğunda Google'ın verdiği "dosya açılamıyor" hatasını önler. */
const DIS_SAYFA = !(window.google && google.script && google.script.run);
/* Çift gönderim kilidi (MehDer, 30.10.2026): sunucuya giden bir işlemi başlatan düğme, işlem bitene kadar
   (en az 0,8 sn) "işleniyor" görünür ve yeniden basılamaz. Kilit düğmenin kimliğine (data-… / form) bağlıdır;
   ekran yeniden çizilse de aynı düğme kilitli kalır. Yalnızca sunucuya gitmeyen düğmeler (sekme, dil, menü) etkilenmez. */
const MESGUL = new Map(); let sonBasilan = null;
function dugmeAnahtar(b) {
  if (!b) return null;
  const f = b.closest('form');
  if (f && (b.type === 'submit' || b.tagName === 'FORM')) return 'f:' + (f.dataset.f || f.id || '');
  const d = Object.entries(b.dataset || {}).filter(([k]) => k !== 'mesgul').sort().map(([k, v]) => k + '=' + v).join('&');
  return d ? 'a:' + d : null;
}
function mesgulBoya() { document.querySelectorAll('button').forEach(b => { const k = dugmeAnahtar(b); const m = k && MESGUL.has(k); b.classList.toggle('mesgul', !!m); if (m) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy'); }); }
function dugmeEngel(e, b) {
  const k = dugmeAnahtar(b); if (!k) return;
  if (MESGUL.has(k)) { e.preventDefault(); e.stopImmediatePropagation(); return; }
  sonBasilan = { k, t: Date.now() }; const sb = sonBasilan; setTimeout(() => { if (sonBasilan === sb) sonBasilan = null; }, 0);   // sunucuya gitmeyen düğme kilit almaz
}
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b && !(b.type === 'submit' && b.closest('form'))) dugmeEngel(e, b); }, true);
document.addEventListener('submit', e => dugmeEngel(e, e.target), true);
new MutationObserver(() => { if (MESGUL.size) mesgulBoya(); }).observe(document.documentElement, { childList: true, subtree: true });
function run(fn, ...a) {
  const s = sonBasilan && Date.now() - sonBasilan.t < 2000 ? sonBasilan : null; sonBasilan = null;
  const p = run0(fn, ...a);
  if (s && !MESGUL.has(s.k)) {
    const bas = Date.now(); MESGUL.set(s.k, bas); mesgulBoya();
    const birak = () => setTimeout(() => { if (MESGUL.get(s.k) === bas) { MESGUL.delete(s.k); mesgulBoya(); } }, Math.max(0, 800 - (Date.now() - bas)));
    p.then(birak, birak);
  }
  return p;
}
/* Sunucu "MESGUL" derse (kilit beklemesi doldu, işlem YAPILMADI) aynı istek 3 kez daha, 1–4 sn arayla gönderilir (yük testi 3.11). */
async function run0(fn, ...a) {
  for (let i = 0; ; i++) {
    try { return await run1(fn, ...a); }
    catch (e) { if (!/^MESGUL/.test(String(e && e.message)) || i >= 3) { if (/^MESGUL/.test(String(e && e.message))) throw new Error('Sistem şu an çok yoğun; lütfen birkaç saniye sonra yeniden deneyin.'); throw e; }
      await new Promise(r => setTimeout(r, 1000 + Math.random() * 3000)); }
  }
}
function run1(fn, ...a) {
  if (!DIS_SAYFA) return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
  // Otomatik yeniden deneme yok: not gönderme ve şifre denemesi iki kez işlenmesin.
  return fetch(window.API_ADRESI, { method: 'POST', credentials: 'omit', redirect: 'follow', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, a }) })
    .then(r => { if (!r.ok) throw new Error('Sunucu yanıt vermedi (' + r.status + ').'); return r.json(); })
    .then(j => { if (j && j.ok) return j.r; throw new Error((j && j.m) || 'Bilinmeyen hata.'); });
}
/* Dış sayfada şablon değerleri (k, c, o, url) adres satırından okunur. */
(function () {
  const app = document.getElementById('app'); if (!app || !DIS_SAYFA) return;
  const p = new URLSearchParams(location.search);
  ['k', 'c', 'o'].forEach(x => { if (!app.dataset[x] && p.get(x)) app.dataset[x] = p.get(x); });
  if ('url' in app.dataset && !app.dataset.url) app.dataset.url = new URL('./', location.href).href;
})();
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } },
  sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, sset(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } }, sdel(k) { try { sessionStorage.removeItem(k); } catch (e) { } }
};
const fmt = v => String(v).replace('.', ',');
function editing() { const a = document.activeElement; return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $('#app').contains(a); }
/* Dokunuş/tıklama sürerken ekran yeniden çizilmez: yazı kutusundan düğmeye basınca bekleyen yenileme düğmeyi
   tıklama tamamlanmadan silmesin (30.10.2026 prova hatası). Tuş bırakıldıktan sonra bekleyen çizim yapılır. */
let basili = false;
document.addEventListener('pointerdown', () => { basili = true; }, true);
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => setTimeout(() => { basili = false; document.dispatchEvent(new Event('focusout')); }, 60), true));
/* Sayfa içi onay / bilgi kutusu (tarayıcı confirm/alert yerine; Claude uygulamasının paneli bunları engelliyor – 19.11.2026). */
function sayfaKutusu_(metin, iki, evet, hayir) {
  return new Promise(ok => {
    const o = document.createElement('div'); o.className = 'skutu-ort';
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
    o.innerHTML = '<div role="dialog" aria-modal="true" style="background:var(--card,#fff);color:inherit;max-width:520px;width:100%;border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)">'
      + '<div class="skutu-metin" style="white-space:pre-wrap;line-height:1.45;margin-bottom:14px"></div><div style="display:flex;gap:8px;justify-content:flex-end">'
      + (iki ? '<button class="btn ghost" data-k="0"></button>' : '') + '<button class="btn" data-k="1"></button></div></div>';
    o.querySelector('.skutu-metin').textContent = metin;
    const b1 = o.querySelector('[data-k="1"]'); b1.textContent = evet || (iki ? 'Evet' : 'Tamam');
    if (iki) o.querySelector('[data-k="0"]').textContent = hayir || 'Vazgeç';
    const bitir = v => { document.removeEventListener('keydown', tus, true); o.remove(); ok(v); };
    const tus = e => { if (e.key === 'Escape') { e.preventDefault(); bitir(false); } if (e.key === 'Enter') { e.preventDefault(); bitir(true); } };
    o.addEventListener('click', e => { const k = e.target.closest && e.target.closest('[data-k]'); if (k) { e.stopPropagation(); bitir(k.dataset.k === '1'); } });
    document.addEventListener('keydown', tus, true); document.body.appendChild(o); b1.focus();
  });
}
function onayla(metin, evet, hayir) { return sayfaKutusu_(String(metin), true, evet, hayir); }
function bilgi(metin) { return sayfaKutusu_(String(metin), false); }
function hataGoster(e) { const m = (e && e.message) || String(e); const el = $('#hata'); if (el) { el.textContent = 'Bağlantı hatası: ' + m + ' Sayfayı yenileyin.'; el.hidden = false; } }

/* Taslak notlar: HESAPLA'ya (writing'de "tamamlandı"ya) kadar yalnızca bu tarayıcıda tutulur, sonra tek seferde gönderilir. */
const TASLAK = {};
try { Object.assign(TASLAK, JSON.parse(store.sget('taslak') || '{}')); } catch (e) { }
function taslakKaydet() { store.sset('taslak', JSON.stringify(TASLAK)); }
function taslak(g, no) { return TASLAK[g + no] || (TASLAK[g + no] = { c: {} }); }
function taslakSil(g, no) { delete TASLAK[g + no]; taslakKaydet(); }
/** Sunucu görünümü + taslak birleşimi (yalnızca açık bentler ve açık özel durum için taslak geçerli). */
function birlesik(v, g, no) {
  const t = TASLAK[g + no], c = Object.assign({}, v.c); let oz = v.oz;
  if (t && !v.sub && v.fin == null) { v.kr.forEach(k => { if (k.acik && t.c[k.k] !== undefined) c[k.k] = t.c[k.k] === '' ? undefined : Number(t.c[k.k]); }); if (v.ozAcik && t.oz !== undefined) oz = t.oz || null; }
  const top = v.kr.reduce((a, k) => a + (Number.isInteger(c[k.k]) ? c[k.k] : 0), 0);
  return { c, oz, top };
}
/** Not bloğu (speaking: g='S', writing: g='W'). v sunucudaki notGorunum_ çıktısıdır; eşin notları yalnızca fark/negotiation aşamasında gelir. */
function notBlok(v, g, no, butonAd) {
  if (v.fin != null) return `<div class="note n-ok">Not kesinleşti: ${v.fin === 'G' ? 'G (girmedi)' : `${v.fin} / ${v.max} · ${v.r100} / 100`}${v.avg != null && v.fin !== 'G' && v.avg !== v.fin ? ` <span class="small">(ortalama ${fmt(v.avg)} → ${v.fin})</span>` : ''}</div>`;
  const ozAd = k => (v.ozler.find(o => o.k === k) || {}).ad || '';
  const B = birlesik(v, g, no);
  let durum = '';
  if (v.neg && v.es) durum = `<div class="note n-hl">Yeniden değerlendirme gerekli: iki hoca farklı özel durum seçti ya da biri özel durum, diğeri bent notu girdi.<p>Sizin seçiminiz: ${v.oz ? esc(ozAd(v.oz)) : 'bent notları'} · Eşiniz: ${v.es.oz ? esc(ozAd(v.es.oz)) : `bent notları (toplam ${v.es.top})`}. Eşinizle görüşüp aynı seçimi yapın.</p></div>`;
  else if (v.tur > 1 && v.hl.length && v.es) durum = `<div class="note n-hl">Toplam notlarınız arasında 2 puandan fazla fark var, öğrencinin performansını yeniden değerlendirin.<p>Sizin toplamınız: <b>${v.top}</b> · Eşinizin toplamı: <b>${v.es.top}</b>. Turuncu bentlerde notlarınız farklı; gerekirse bütün bentleri değiştirebilirsiniz.</p></div>`;
  const kr = B.oz ? '' : `<div class="crit">${v.kr.map(c => { const hl = v.hl.includes(c.k); return `<label class="${hl ? 'hlb' : ''}">${esc(c.ad)} (0–${c.max})<input id="${g}-${no}-${c.k}" type="number" min="0" max="${c.max}" step="1" inputmode="numeric" value="${B.c[c.k] ?? ''}" ${c.acik ? '' : 'disabled'} data-not="${g}" data-no="${no}" data-k="${c.k}">${hl && v.es ? `<span class="pv">Eşiniz: ${v.es.c[c.k] ?? '—'}</span>` : ''}</label>`; }).join('')}</div>`;
  const buton = butonAd ? `<button class="btn sm" data-act="${g === 'S' ? 'hesapla' : 'wKaydet'}" data-no="${no}" ${v.sub ? 'disabled' : ''}>${butonAd}</button>` : '';
  return `<div class="stack" style="gap:8px">${durum}
    <label class="f">Özel durum<select id="${g}-${no}-oz" data-not="${g}" data-no="${no}" data-oz="1" ${v.ozAcik ? '' : 'disabled'}><option value="">— yok (bent notu girilecek) —</option>${v.ozler.map(o => `<option value="${o.k}" ${B.oz === o.k ? 'selected' : ''}>${esc(o.ad)}${o.puan == null ? ' (G)' : ` (${o.puan})`}</option>`).join('')}</select></label>
    ${kr}<div class="tot"><span>Sizin toplamınız: <span class="n" id="top-${g}-${no}">${B.oz ? '—' : B.top}</span> / ${v.max}</span>${v.sub ? '<span class="pill p-acc">Eşinizin notu bekleniyor</span>' : ''}${buton}<span class="reasons" id="msg-${g}-${no}"></span></div></div>`;
}
</script>

<script>
/* BirimUI.html – Birim çalışmaları ekranı (hoca ve yönetim sayfalarında ortak; 17.11.2026).
   Sayfanın global `ot` oturumunu ve `render(true)` işlevini kullanır. */
let BV = null, bSec = null, bMsg = '', bHata = '', bTaslak = {}, bYukleniyor = false;
const bEsc = esc;
async function birimYukle() {
  bYukleniyor = true;
  try { const r = await run('apiBirim', ot); if (r.err) { bHata = r.err === 'OTURUM' ? 'Oturum sona erdi; yeniden giriş yapın.' : r.err; BV = null; } else { BV = r; bHata = ''; if (!bSec || !BV.birimler.some(b => b.id === bSec)) bSec = (BV.birimler[0] || {}).id || null; } }
  catch (e) { bHata = (e && e.message) || String(e); }
  bYukleniyor = false; render(true);
}
function bDosyaTablo(b, L, arsiv) {
  if (!L.length) return `<p class="small muted">${arsiv ? 'Arşivde dosya yok.' : 'Bu dönem yüklenmiş dosya yok.'}</p>`;
  return `<div class="scroll"><table><thead><tr><th>Dosya</th><th>Etiket</th>${b.duzeyli ? '<th>Düzey</th>' : ''}<th>Yükleyen</th><th>Tarih</th>${arsiv ? '<th>Dönem</th>' : ''}<th></th></tr></thead><tbody>
    ${L.map(d => `<tr><td><b>${bEsc(d.ad)}</b> <span class="small muted">${d.kb} KB</span></td><td><span class="pill p-acc">${bEsc(d.etiket)}</span></td>${b.duzeyli ? `<td>${d.lv === 'Ortak' ? '<span class="pill p-ok">Ortak</span>' : bEsc(d.lv)}</td>` : ''}
      <td>${bEsc(d.kim)}</td><td class="small">${bEsc(d.tarih)}</td>${arsiv ? `<td class="small">${bEsc(d.donem)}</td>` : ''}
      <td><div class="row"><button class="btn sm" data-bact="indir" data-id="${bEsc(d.id)}">İndir</button>
        ${d.ortakYap ? (d.lv === 'Ortak' ? `<select class="sm" data-bact-sel="ortak" data-id="${bEsc(d.id)}" style="width:auto"><option value="">Düzeye al…</option>${BV.duzeyler.map(l => `<option>${l}</option>`).join('')}</select>` : `<button class="btn sm ghost" data-bact="ortak" data-id="${bEsc(d.id)}" data-lv="Ortak">Ortak yap</button>`) : ''}
        ${d.kaldirabilir ? `<button class="btn sm bad ghost" data-bact="kaldir" data-id="${bEsc(d.id)}">Kaldır</button>` : ''}</div></td></tr>`).join('')}</tbody></table></div>`;
}
function bArsiv(b) {
  if (!b.arsiv.length) return '';
  const gr = {}; b.arsiv.forEach(d => (gr[d.donem] = gr[d.donem] || []).push(d));
  return `<details class="panel"><summary><b>Arşiv – önceki dönemler ve yıllar</b> <span class="small muted">(${b.arsiv.length} dosya)</span></summary>
    ${Object.keys(gr).sort().reverse().map(k => `<h4 style="margin:12px 0 6px">${bEsc(k)}</h4>${bDosyaTablo(b, gr[k], false)}`).join('')}</details>`;
}
function bHedefSec(b, id) {
  return `<select id="${id}" style="width:auto"><option value="birim">Tüm birim</option>${b.duzeyli ? BV.duzeyler.map(l => `<option value="duzey:${l}">${l} düzeyi</option>`).join('') : ''}
    ${b.uyeler.map(u => `<option value="hoca:${bEsc(u.e)}">${bEsc(u.ad)}${u.lv ? ' (' + u.lv + ')' : ''}</option>`).join('')}</select>`;
}
function bMesajlar(b) {
  const yeni = b.yonetici ? `<div class="panel stack"><h4 style="margin:0">Yeni mesaj</h4>
    <div class="row" style="gap:8px;flex-wrap:wrap"><label class="small">Alıcı ${bHedefSec(b, 'bmHedef')}</label><label class="ck small"><input type="checkbox" id="bmBildir" checked> Bildirim e-postası gönder</label></div>
    <textarea id="bmMetin" rows="3" maxlength="4000" data-btaslak="yeni:${b.id}" style="width:100%">${bEsc(bTaslak['yeni:' + b.id] || '')}</textarea>
    <div><button class="btn sm" data-bact="mesaj">Gönder</button></div></div>` : '';
  const L = b.mesajlar.map(m => {
    const kisiler = [...new Map(m.yanit.filter(y => !y.yon).map(y => [y.ke, y.kim])).entries()];
    return `<div class="panel stack" style="gap:8px"><div class="small muted">${bEsc(m.tarih)} · ${bEsc(m.kim)} → ${bEsc(m.hedef)}</div><div style="white-space:pre-wrap">${bEsc(m.metin)}</div>
      ${m.yanit.map(y => `<div style="border-left:3px solid var(--line);padding-left:10px"><div class="small muted">${bEsc(y.tarih)} · ${bEsc(y.kim)}${y.yon && b.yonetici ? ' → ' + bEsc(y.hedef) : ''}</div><div style="white-space:pre-wrap">${bEsc(y.metin)}</div></div>`).join('')}
      <details><summary class="small"><b>Yanıtla</b></summary><div class="stack" style="gap:6px;margin-top:6px">
        ${b.yonetici ? `<div class="row" style="gap:8px;flex-wrap:wrap"><label class="small">Kime <select id="bk-${m.id}" style="width:auto"><option value="">Mesajın alıcıları</option>${kisiler.map(([e, ad]) => `<option value="${bEsc(e)}">${bEsc(ad)}</option>`).join('')}</select></label><label class="ck small"><input type="checkbox" id="bb-${m.id}"> Bildirim e-postası</label></div>` : ''}
        <textarea id="by-${m.id}" rows="2" maxlength="4000" data-btaslak="y:${m.id}" style="width:100%">${bEsc(bTaslak['y:' + m.id] || '')}</textarea>
        <div><button class="btn sm" data-bact="yanit" data-id="${m.id}">Yanıtı gönder</button></div></div></details></div>`;
  }).join('');
  return `<h3 style="margin:8px 0 0">Mesajlar</h3>${yeni}${L || '<p class="small muted">Mesaj yok.</p>'}`;
}
function vBirim() {
  if (bHata) return `<div class="note n-bad">${bEsc(bHata)}</div>`;
  if (!BV) return '<div class="panel muted">Birim çalışmaları yükleniyor…</div>';
  if (!BV.birimler.length) return '<div class="panel">Görebileceğiniz bir birim yok.</div>';
  const b = BV.birimler.find(x => x.id === bSec) || BV.birimler[0];
  const sekme = BV.birimler.length > 1 ? `<div class="tabs">${BV.birimler.map(x => `<button class="${x.id === b.id ? 'on' : ''}" data-bact="sec" data-id="${x.id}">${bEsc(x.ad)}</button>`).join('')}</div>` : '';
  const yukle = `<div class="panel stack"><h4 style="margin:0">Dosya yükle</h4>
    <div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">
      <label class="f" style="flex:1 1 240px">Dosya (en çok ${BV.maxMb} MB)<input type="file" id="bDosya"></label>
      <label class="f">Etiket (zorunlu)<select id="bEtiket" style="width:auto"><option value="">Seçin…</option>${b.etiket.map(e => `<option>${bEsc(e)}</option>`).join('')}</select></label>
      ${b.duzeyli && b.yonetici ? `<label class="f">Düzey<select id="bLv" style="width:auto"><option value="">Seçin…</option><option>Ortak</option>${BV.duzeyler.map(l => `<option>${l}</option>`).join('')}</select></label>` : ''}
      ${b.yonetici ? '<label class="ck small"><input type="checkbox" id="bBildir" checked> Bildirim e-postası gönder</label>' : ''}
      <button class="btn" data-bact="yukle">Yükle</button></div>
    ${b.duzeyli && !b.yonetici ? `<p class="small muted" style="margin:0">Yüklediğiniz dosyayı ${bEsc(b.lv)} düzeyindeki üyeler ve yönetim görür. "Ortak" (bütün düzeyler) yapmayı yalnız yönetim seçebilir.</p>` : ''}</div>`;
  const ek = b.yonetici ? `<details class="panel"><summary><b>Üyeler</b> <span class="small muted">(${b.uyeler.length})</span></summary><ul>${b.uyeler.map(u => `<li>${bEsc(u.ad)}${u.lv ? ' · ' + u.lv : ''} <span class="small muted">${bEsc(u.e)}</span>${u.sistemde ? '' : ' <span class="pill p-warn">sistemde değil</span>'}</li>`).join('')}</ul>
      ${b.uyeler.some(u => !u.sistemde) && BV.tam ? '<button class="btn sm" data-bact="uyeEkle">Eksik üyeleri sisteme ekle</button>' : ''}</details>
    <details class="panel"><summary><b>Kaldırılan dosyalar</b> <span class="small muted">(${b.kaldirilan.length}; "eski versiyonlar" klasöründe)</span></summary>${b.kaldirilan.length ? `<ul>${b.kaldirilan.map(k => `<li>${bEsc(k.ad)} · ${bEsc(k.etiket)}${k.lv ? ' · ' + bEsc(k.lv) : ''} – yükleyen ${bEsc(k.kim)}, kaldıran ${bEsc(k.kaldiran)} (${bEsc(k.tarih)})</li>`).join('')}</ul>` : '<p class="small muted">Yok.</p>'}</details>
    <details class="panel"><summary><b>İndirme kaydı</b> <span class="small muted">(${b.indirmeler.length})</span></summary>${b.indirmeler.length ? `<div class="scroll"><table><thead><tr><th>Tarih</th><th>Kim</th><th>Dosya</th></tr></thead><tbody>${b.indirmeler.map(x => `<tr><td class="small">${bEsc(x.tarih)}</td><td>${bEsc(x.ad)}</td><td>${bEsc(x.dosya)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="small muted">Henüz indirme yok.</p>'}</details>` : '';
  return `<div class="stack">${sekme}<div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="margin:0">${bEsc(b.ad)}${b.lv ? ` <span class="pill p-acc">${bEsc(b.lv)} düzeyi</span>` : ''}</h2><span class="small muted">Dönem: ${bEsc(b.donem)}</span></div>
    ${bMsg ? `<div class="note n-ok">${bEsc(bMsg)}</div>` : ''}${yukle}
    <div class="panel"><h3 style="margin:0 0 8px">Dosyalar – ${bEsc(b.donem)}</h3>${bDosyaTablo(b, b.dosyalar, false)}</div>${bArsiv(b)}${bMesajlar(b)}${ek}</div>`;
}
async function bOnay(b, hedef) {   // yönetim bildirimi: önce alıcı listesi gösterilir, onaylanırsa gider
  const r = await run('apiBirimIslem', ot, 'bildirimOnizle', { birim: b.id, hedef });
  if (r.hata) { bilgi(r.hata); return false; }
  if (!r.n) return true;
  return await onayla('Bildirim e-postası şu ' + r.n + ' kişiye gidecek:\n\n' + r.alicilar.join(', ') + '\n\nOnaylıyor musunuz?');
}
async function bIslem(islem, a) {
  const r = await run('apiBirimIslem', ot, islem, a);
  if (r.err === 'OTURUM') { bHata = 'Oturum sona erdi; yeniden giriş yapın.'; return render(true); }
  if (r.hata) { bilgi(r.hata); return; }
  bMsg = r.mesaj || ''; if (r.v) BV = r.v; render(true); return r;
}
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.btaslak; if (k) bTaslak[k] = e.target.value; });
document.addEventListener('change', async e => {
  const el = e.target; if (!el.dataset || el.dataset.bactSel !== 'ortak' || !el.value) return;
  const b = BV.birimler.find(x => x.id === bSec); await bIslem('ortak', { birim: b.id, id: el.dataset.id, lv: el.value });
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-bact]'); if (!el || !BV) return; const d = el.dataset, b = BV.birimler.find(x => x.id === bSec) || BV.birimler[0];
  if (d.bact === 'sec') { bSec = d.id; bMsg = ''; return render(true); }
  try {
    el.disabled = true;
    if (d.bact === 'yukle') {
      const f = $('#bDosya').files[0], et = $('#bEtiket').value, lv = $('#bLv') ? $('#bLv').value : '', bildir = !!($('#bBildir') && $('#bBildir').checked);
      if (!f) return bilgi('Dosya seçin.'); if (!et) return bilgi('Etiket seçmek zorunludur.'); if (b.duzeyli && b.yonetici && !lv) return bilgi('Düzey seçin (ya da Ortak).');
      if (f.size > BV.maxMb * 1048576) return bilgi('Dosya ' + BV.maxMb + ' MB\'tan büyük olamaz.');
      if (b.yonetici && bildir && !(await bOnay(b, b.duzeyli ? lv : 'birim'))) return;
      bMsg = 'Yükleniyor…'; render(true);
      const b64 = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1] || ''); fr.onerror = () => no(fr.error); fr.readAsDataURL(f); });
      await bIslem('yukle', { birim: b.id, ad: f.name, tur: f.type, etiket: et, lv, b64, bildir });
    }
    if (d.bact === 'indir') {
      const r = await run('apiBirimIslem', ot, 'indir', { birim: b.id, id: d.id }); if (r.hata) return bilgi(r.hata);
      const bin = atob(r.b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u8], { type: r.tur || 'application/octet-stream' })); a.download = r.ad; document.body.appendChild(a); a.click(); a.remove();
    }
    if (d.bact === 'kaldir' && await onayla('Dosya kaldırılsın mı? (Silinmez, "eski versiyonlar" klasörüne taşınır.)')) await bIslem('kaldir', { birim: b.id, id: d.id });
    if (d.bact === 'ortak') await bIslem('ortak', { birim: b.id, id: d.id, lv: d.lv });
    if (d.bact === 'mesaj') {
      const metin = ($('#bmMetin').value || '').trim(), hedef = $('#bmHedef').value, bildir = $('#bmBildir').checked; if (!metin) return bilgi('Mesaj yazın.');
      if (bildir && !(await bOnay(b, hedef))) return;
      if (await bIslem('mesaj', { birim: b.id, hedef, metin, bildir })) delete bTaslak['yeni:' + b.id];
    }
    if (d.bact === 'yanit') {

    if (d.act === 'cozuldu') { const r = await run('apiYonetimIslem', ot, 'cozuldu', { id: d.id }); if (r.v) V = r.v; mesaj = ''; }
    if (d.act === 'yayinla') { if (!d.zorla || confirm('Düzey henüz "hazır" değil (süren sınav ya da kesinleşmemiş not olabilir). Yine de yayımlansın mı?')) { const r = await run('apiYonetimIslem', ot, 'yayinla', { key: d.key, zorla: !!d.zorla }); mesaj = r.mesaj || ''; if (r.v) V = r.v; } }
    sonAcik = acikSay();
  } catch (err) { hataGoster(err); }
  render();
});
setInterval(() => { tik++; if (V && (!V.rol || V.rol === 'tam') && tab !== 'birim' && tab !== 'sinav' && tab !== 'derslik' && (V.deneme || tik % 2 === 0)) yukle(); }, 5000);   // birim ekranı canlı değil (dosya seçimi kaybolmasın)
yukle();
</script>
